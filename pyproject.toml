[project]
name = "veriforge"
version = "0.1.0"
description = "Evidence-driven assurance for AI-generated software changes"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.1",
    "pydantic==2.11.7",
    "uvicorn==0.35.0",
    "psycopg[binary]>=3.2,<4",
    "httpx==0.28.1",
    "prometheus-client>=0.21,<1",
    "opentelemetry-sdk>=1.30,<2",
    "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
